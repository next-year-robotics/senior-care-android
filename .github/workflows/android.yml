name: android
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: dummy keys (지도 없이도 빌드돼야 한다)
        run: printf 'KAKAO_NATIVE_APP_KEY=dummy\nKAKAO_REST_API_KEY=dummy\n' > local.properties
      - run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-apk-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/**
          if-no-files-found: ignore
  contracts-drift:
    runs-on: ubuntu-latest
    continue-on-error: ${{ vars.CONTRACTS_DRIFT_SOFT == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: fetch upstream contracts
        run: |
          git clone --depth 1 --filter=blob:none --sparse --branch "${{ vars.CONTRACTS_REF || 'main' }}" \
            https://github.com/next-year-robotics/mobile-robot.git /tmp/mr
          git -C /tmp/mr sparse-checkout set software/contracts/phone-bridge
      - run: diff -r /tmp/mr/software/contracts/phone-bridge contracts/phone-bridge
